<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Admin — todas as transações MuhBianco." />
  <title>Admin · Transações — MuhBianco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=15" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="/">MuhBianco</a>
    <nav class="nav" aria-label="Principal">
      <a href="/conta.html">Conta</a>
      <a href="/admin-transacoes.html" class="nav-cta" aria-current="page">Admin · Transações</a>
    </nav>
  </header>

  <main class="account-page">
    <section class="account-hero">
      <p class="brand-mark compact">Administração</p>
      <h1>Todas as transações</h1>
      <p class="auth-lede">Filtre por cliente e data. Estorne pagamentos confirmados ou cancele pendentes.</p>
    </section>

    <section class="account-panel tx-panel">
      <form class="admin-filters" id="filters" autocomplete="off">
        <label>
          <span>Cliente</span>
          <input type="search" id="f-search" placeholder="E-mail, nome ou id" />
        </label>
        <label>
          <span>Status</span>
          <select id="f-status">
            <option value="">Todos</option>
            <option value="pending">Pendente</option>
            <option value="paid">Pago</option>
            <option value="refunded">Estornado</option>
            <option value="cancelled">Cancelado</option>
            <option value="failed">Falhou</option>
            <option value="expired">Expirado</option>
          </select>
        </label>
        <label>
          <span>De</span>
          <input type="date" id="f-from" />
        </label>
        <label>
          <span>Até</span>
          <input type="date" id="f-to" />
        </label>
        <div class="admin-filters-actions">
          <button type="submit" class="btn btn-primary">Filtrar</button>
          <button type="button" class="btn btn-ghost" id="btn-clear">Limpar</button>
        </div>
      </form>

      <div id="tx-error" class="auth-alert" hidden></div>
      <div id="tx-ok" class="auth-ok" hidden></div>
      <div id="tx-empty" class="tx-empty" hidden>
        <p>Nenhuma transação com esses filtros.</p>
      </div>

      <div class="tx-table-wrap" id="tx-table-wrap" hidden>
        <table class="tx-table admin-tx-table" aria-label="Transações admin">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Cliente</th>
              <th scope="col">Valor</th>
              <th scope="col">Status</th>
              <th scope="col">Saldo</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>

      <div class="admin-pager" id="pager" hidden>
        <button type="button" class="btn btn-ghost" id="btn-prev">Anterior</button>
        <span id="pager-label">—</span>
        <button type="button" class="btn btn-ghost" id="btn-next">Próxima</button>
      </div>

      <div class="balance-actions" style="margin-top: 1.25rem">
        <a class="btn btn-ghost" href="/conta.html">Voltar</a>
      </div>
    </section>
  </main>

  <script src="/js/auth.js?v=10"></script>
  <script>
    (async function () {
      if (!MuhAuth.requireAuth()) return;

      const errorBox = document.getElementById("tx-error");
      const okBox = document.getElementById("tx-ok");
      const emptyBox = document.getElementById("tx-empty");
      const tableWrap = document.getElementById("tx-table-wrap");
      const tbody = document.getElementById("tx-body");
      const pager = document.getElementById("pager");
      const pagerLabel = document.getElementById("pager-label");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");

      let page = 1;
      const pageSize = 20;
      let pages = 1;

      function brl(cents) {
        return (Number(cents) / 100).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "—";
        return d.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function statusMeta(status) {
        const map = {
          paid: { label: "Pago", tone: "ok" },
          pending: { label: "Pendente", tone: "wait" },
          failed: { label: "Falhou", tone: "err" },
          cancelled: { label: "Cancelado", tone: "err" },
          expired: { label: "Expirado", tone: "err" },
          refunded: { label: "Estornado", tone: "err" },
        };
        return map[status] || { label: status || "—", tone: "wait" };
      }

      function showError(msg) {
        okBox.hidden = true;
        errorBox.hidden = false;
        errorBox.textContent = msg;
      }

      function showOk(msg) {
        errorBox.hidden = true;
        okBox.hidden = false;
        okBox.textContent = msg;
      }

      function filtersPayload() {
        const search = document.getElementById("f-search").value.trim();
        const status = document.getElementById("f-status").value;
        const from = document.getElementById("f-from").value;
        const to = document.getElementById("f-to").value;
        const payload = { page, page_size: pageSize };
        if (search) payload.search = search;
        if (status) payload.status = status;
        if (from) payload.created_from = `${from}T00:00:00`;
        if (to) payload.created_to = `${to}T23:59:59`;
        return payload;
      }

      function renderRows(items) {
        tbody.innerHTML = "";
        items.forEach((tx) => {
          const meta = statusMeta(tx.status);
          const when = tx.paid_at || tx.created_at;
          const tr = document.createElement("tr");
          tr.dataset.id = tx.id;

          let actions = '<span class="tx-detail">—</span>';
          if (tx.can_refund) {
            actions = `<button type="button" class="btn btn-ghost btn-compact" data-action="refund">Estornar</button>`;
          } else if (tx.can_cancel) {
            actions = `<button type="button" class="btn btn-ghost btn-compact" data-action="cancel">Cancelar</button>`;
          }

          tr.innerHTML = `
            <td><span class="tx-date">${formatDate(when)}</span></td>
            <td>
              <span class="tx-client">${tx.user_full_name || "—"}</span>
              <span class="tx-detail">${tx.user_email || ""}</span>
            </td>
            <td><span class="tx-amount">${brl(tx.amount_cents)}</span></td>
            <td><span class="tx-status tx-status--${meta.tone}">${meta.label}</span></td>
            <td><span class="tx-detail">${brl(tx.wallet_balance_cents)}</span></td>
            <td class="tx-actions">${actions}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      async function load() {
        errorBox.hidden = true;
        try {
          const data = await MuhAuth.adminListTopups(filtersPayload());
          const items = data.items || [];
          pages = data.pages || 1;
          page = data.page || 1;

          emptyBox.hidden = items.length > 0;
          tableWrap.hidden = items.length === 0;
          pager.hidden = items.length === 0;
          pagerLabel.textContent = `Página ${page} de ${pages} · ${data.total || 0} itens`;
          btnPrev.disabled = page <= 1;
          btnNext.disabled = page >= pages;

          if (items.length) renderRows(items);
        } catch (err) {
          if (String(err.message || "").toLowerCase().includes("permiss") || err.code === "permission_denied") {
            location.href = "/conta.html";
            return;
          }
          tableWrap.hidden = true;
          emptyBox.hidden = true;
          pager.hidden = true;
          showError(err.message || "Falha ao carregar.");
        }
      }

      document.getElementById("filters").addEventListener("submit", (event) => {
        event.preventDefault();
        page = 1;
        load();
      });

      document.getElementById("btn-clear").addEventListener("click", () => {
        document.getElementById("f-search").value = "";
        document.getElementById("f-status").value = "";
        document.getElementById("f-from").value = "";
        document.getElementById("f-to").value = "";
        page = 1;
        load();
      });

      btnPrev.addEventListener("click", () => {
        if (page > 1) {
          page -= 1;
          load();
        }
      });
      btnNext.addEventListener("click", () => {
        if (page < pages) {
          page += 1;
          load();
        }
      });

      tbody.addEventListener("click", async (event) => {
        const btn = event.target.closest("[data-action]");
        if (!btn) return;
        const tr = btn.closest("tr");
        const id = tr && tr.dataset.id;
        if (!id) return;

        const action = btn.dataset.action;
        const label = action === "refund" ? "estornar" : "cancelar";
        if (!confirm(`Confirma ${label} esta recarga?`)) return;

        btn.disabled = true;
        try {
          if (action === "refund") {
            await MuhAuth.adminRefundTopup(id);
            showOk("Estorno concluído (saldo debitado e solicitado no Mercado Pago).");
          } else {
            await MuhAuth.adminCancelTopup(id);
            showOk("Recarga pendente cancelada.");
          }
          await load();
        } catch (err) {
          showError(err.message || `Falha ao ${label}.`);
          btn.disabled = false;
        }
      });

      try {
        const user = await MuhAuth.me();
        if (user.role !== "admin") {
          location.href = "/conta.html";
          return;
        }
        await load();
      } catch (err) {
        await MuhAuth.logout();
        location.href = "/login.html?error=authentication_failed";
      }
    })();
  </script>
</body>
</html>
