<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Histórico de transações e recargas — MuhBianco." />
  <title>Transações — MuhBianco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=7" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="/">MuhBianco</a>
    <nav class="nav" aria-label="Principal">
      <a href="/conta.html">Conta</a>
      <a href="/transacoes.html" class="nav-cta" aria-current="page">Transações</a>
    </nav>
  </header>

  <main class="account-page">
    <section class="account-hero">
      <p class="brand-mark compact">Carteira</p>
      <h1>Transações</h1>
      <p class="auth-lede">Recargas via Mercado Pago — status, valor e data.</p>
    </section>

    <section class="account-panel tx-panel">
      <div id="tx-error" class="auth-alert" hidden></div>
      <div id="tx-empty" class="tx-empty" hidden>
        <p>Nenhuma transação ainda.</p>
        <a class="btn btn-primary" href="/checkout.html">Adicionar saldo</a>
      </div>
      <div class="tx-table-wrap" id="tx-table-wrap" hidden>
        <table class="tx-table" aria-label="Histórico de transações">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Valor</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
      <div class="balance-actions" style="margin-top: 1.25rem">
        <a class="btn btn-ghost" href="/conta.html">Voltar</a>
        <a class="btn btn-primary" href="/checkout.html">Adicionar saldo</a>
      </div>
    </section>
  </main>

  <script src="/js/auth.js?v=6"></script>
  <script>
    (async function () {
      if (!MuhAuth.requireAuth()) return;

      const errorBox = document.getElementById("tx-error");
      const emptyBox = document.getElementById("tx-empty");
      const tableWrap = document.getElementById("tx-table-wrap");
      const tbody = document.getElementById("tx-body");

      function brl(cents) {
        return (Number(cents) / 100).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "—";
        return d.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function statusMeta(status) {
        const map = {
          paid: { label: "Sucesso", tone: "ok", detail: "Saldo creditado" },
          pending: { label: "Pendente", tone: "wait", detail: "Aguardando pagamento" },
          failed: { label: "Erro", tone: "err", detail: "Pagamento recusado" },
          cancelled: { label: "Cancelada", tone: "err", detail: "Pagamento cancelado" },
          expired: { label: "Expirada", tone: "err", detail: "Prazo esgotado" },
        };
        return map[status] || { label: status || "—", tone: "wait", detail: "" };
      }

      try {
        const items = await MuhAuth.listTopups();
        if (!items.length) {
          emptyBox.hidden = false;
          return;
        }

        tableWrap.hidden = false;
        tbody.innerHTML = "";
        items.forEach((tx) => {
          const meta = statusMeta(tx.status);
          const when = tx.paid_at || tx.created_at;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <span class="tx-date">${formatDate(when)}</span>
            </td>
            <td>
              <span class="tx-amount">${brl(tx.amount_cents)}</span>
            </td>
            <td>
              <span class="tx-status tx-status--${meta.tone}">${meta.label}</span>
              <span class="tx-detail">${meta.detail}</span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        errorBox.hidden = false;
        errorBox.textContent = err.message || "Falha ao carregar transações.";
      }
    })();
  </script>
</body>
</html>
