<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Admin — cobrança dos serviços MuhBianco." />
  <title>Admin · Serviços — MuhBianco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=14" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="/">MuhBianco</a>
    <nav class="nav" aria-label="Principal">
      <a href="/conta.html">Conta</a>
      <a href="/admin-servicos.html" class="nav-cta" aria-current="page">Admin · Serviços</a>
    </nav>
  </header>

  <main class="settings-page">
    <section class="settings-head">
      <p class="brand-mark compact">Administração</p>
      <h1>Cobrança dos serviços</h1>
      <p class="auth-lede">
        Cada serviço define seu modo de cobrança. Alterações valem para novas assinaturas —
        quem já assinou mantém o preço congelado até renovar.
      </p>
    </section>

    <div class="settings-layout">
      <nav class="settings-nav" aria-label="Seções">
        <a href="/admin-servicos.html" class="is-current">Serviços</a>
        <a href="/admin-transacoes.html">Transações</a>
        <a href="/conta.html">Conta</a>
      </nav>

      <div class="settings-sections">
        <section class="settings-section">
          <h2>Catálogo</h2>
          <div id="admin-error" class="auth-alert" hidden></div>
          <div id="admin-ok" class="auth-ok" hidden></div>
          <div id="admin-list"></div>
        </section>
      </div>
    </div>
  </main>

  <template id="tpl-admin-service">
    <article class="settings-card">
      <header class="settings-card-head">
        <div>
          <h3 data-field="name"></h3>
          <p class="hint" data-field="code"></p>
          <p class="hint" data-field="subscribers"></p>
        </div>
        <span class="settings-badge" data-field="badge" data-state="info">—</span>
      </header>

      <form class="settings-card-body" data-field="form">
        <div class="admin-filters">
          <label>
            <span>Modo de cobrança</span>
            <select data-field="billing_mode">
              <option value="monthly">Assinatura por período</option>
              <option value="per_use">Por uso</option>
            </select>
          </label>
          <label>
            <span>Preço (R$)</span>
            <input type="number" data-field="price" min="0" step="0.01" required />
          </label>
          <label>
            <span>Período (dias)</span>
            <input type="number" data-field="period_days" min="1" max="365" required />
          </label>
          <label>
            <span>Saldo mínimo (R$)</span>
            <input type="number" data-field="min_balance" min="0" step="0.01" required />
          </label>
          <label>
            <span>Situação</span>
            <select data-field="is_active">
              <option value="true">Ativo no catálogo</option>
              <option value="false">Oculto</option>
            </select>
          </label>
          <label>
            <span>Exige WhatsApp</span>
            <select data-field="requires_phone">
              <option value="true">Sim</option>
              <option value="false">Não</option>
            </select>
          </label>
        </div>
        <div class="admin-filters-actions">
          <button type="submit" class="btn btn-primary" data-field="save">Salvar</button>
        </div>
      </form>
    </article>
  </template>

  <script src="/js/auth.js?v=11"></script>
  <script>
    (async function () {
      if (!MuhAuth.requireAuth()) return;

      const listEl = document.getElementById("admin-list");
      const errorEl = document.getElementById("admin-error");
      const okEl = document.getElementById("admin-ok");
      const tpl = document.getElementById("tpl-admin-service");

      function showError(message) {
        okEl.hidden = true;
        errorEl.hidden = false;
        errorEl.textContent = message;
      }

      function showOk(message) {
        errorEl.hidden = true;
        okEl.hidden = false;
        okEl.textContent = message;
      }

      function buildCard(service) {
        const node = tpl.content.firstElementChild.cloneNode(true);
        const q = (name) => node.querySelector(`[data-field="${name}"]`);

        q("name").textContent = service.name;
        q("code").textContent = service.code;
        q("subscribers").textContent = `${service.active_subscriptions} assinatura(s) ativa(s)`;
        q("badge").textContent = service.is_active ? "No catálogo" : "Oculto";
        q("badge").dataset.state = service.is_active ? "done" : "pending";

        q("billing_mode").value = service.billing_mode;
        q("price").value = (service.price_cents / 100).toFixed(2);
        q("period_days").value = service.period_days;
        q("min_balance").value = (service.min_balance_cents / 100).toFixed(2);
        q("is_active").value = String(service.is_active);
        q("requires_phone").value = String(service.requires_phone);

        q("form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const btn = q("save");
          btn.disabled = true;
          try {
            await MuhAuth.adminUpdateService(service.id, {
              billing_mode: q("billing_mode").value,
              price_cents: Math.round(Number(q("price").value) * 100),
              period_days: Number(q("period_days").value),
              min_balance_cents: Math.round(Number(q("min_balance").value) * 100),
              is_active: q("is_active").value === "true",
              requires_phone: q("requires_phone").value === "true",
            });
            showOk(`"${service.name}" atualizado.`);
            await load();
          } catch (err) {
            showError(err.message || "Não foi possível salvar.");
          } finally {
            btn.disabled = false;
          }
        });

        return node;
      }

      async function load() {
        const services = await MuhAuth.adminListServices();
        listEl.innerHTML = "";
        services.forEach((service) => listEl.appendChild(buildCard(service)));
      }

      try {
        const user = await MuhAuth.me();
        if (user.role !== "admin") {
          location.href = "/conta.html";
          return;
        }
        await load();
      } catch (err) {
        showError(err.message || "Falha ao carregar o catálogo.");
      }
    })();
  </script>
</body>
</html>
